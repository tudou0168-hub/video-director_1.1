        console.warn("timeline.json not found, using example timeline");
      }
      const response = await fetch("./timeline.example.json");
      return response.json();
    }

    function componentName(segment) {
      return segment.component || legacyMap[segment.visual_module] || segment.visual_module || "TopicCard";
    }

    function safeText(value) {
      return String(value || "").replace(/[<>]/g, "");
    }

    function richText(value) {
      let text = safeText(value);
      const rules = [
        { pattern: /(5小时|40分钟|30分钟|10分钟|1条|3条|4个字段|3个问题|3到5源)/g, cls: "result" },
        { pattern: /(刷热点|假装工作|执行力|空白|损耗)/g, cls: "loss" },
        { pattern: /(≠\s*效率提升|不等于效率提升)/g, cls: "accent" },
        { pattern: /(Hermes|Obsidian|llm-wiki|Codex|HyperFrames|AI)/g, cls: "tool" },
        { pattern: /(情报|筛选|痛点|产品|系统|复用|判断|清单)/g, cls: "" }
      ];
      rules.forEach(({ pattern, cls }) => {
        text = text.replace(pattern, `<span class="creator-emphasis ${cls}">$1</span>`);
      });
      text = text.replace(/\n/g, "<br>");
      return text;
    }

    function safeAssetPath(value) {
      const assetPath = String(value || "").trim().replace(/["'<>\\]/g, "");
      if (!assetPath) return "";
      if (assetPath.startsWith("assets/") || assetPath.startsWith("./assets/")) return assetPath;
      return "";
    }

    function safeList(value, fallback = []) {
      return Array.isArray(value) ? value : fallback;
    }

    function defaultProps(component, segment) {
      const caption = segment.caption_line || segment.text || "";
      if (component === "HookScene") return { kicker: "问题命中", headline: caption, subline: "先看问题，再看工具" };
      if (component === "ProblemAlert") return { problem: caption, loss: "时间被消耗，结果没沉淀" };
      if (component === "KPIWidget") return { value: segment.emphasis_keyword || "3步", label: caption };
      if (component === "AgentDashboard") return { nodes: ["Hermes", "Obsidian", "llm-wiki", "Codex", "HyperFrames"] };
      if (component === "BigKineticTitle") return { headline: caption, subline: "不是工具不够多，是没有系统", label_en: "AI TOOLS", label_cn: "工具焦虑", step: "01", step_label: "PROBLEM" };
      if (component === "MegaNumber") return { value: segment.emphasis_keyword || "3步", label: caption, label_en: "RESULT", label_cn: "结果数字", step: "02", step_label: "KPI" };
      if (component === "OptionSplitCard") return { left: "手动刷热点", right: "Hermes 自动采集", label_en: "CHOICE", label_cn: "两种路径", step: "01", step_label: "采集" };
      if (component === "ThreeStepPipeline") return { steps: ["Hermes", "Obsidian", "llm-wiki"], label_en: "SYSTEM FLOW", label_cn: "系统流程", step: "02", step_label: "编译" };
      if (component === "DetailsTableOverlay") return { title: "选题库打分", rows: [["痛点", "9.2"], ["复用", "8.8"], ["转化", "8.5"]], label_en: "SCORING", label_cn: "判断标准", step: "03", step_label: "评分" };
      if (component === "ScoringQuestionPanel") return { title: "3个筛选问题", questions: ["能解释痛点？", "能绑定产品？", "能带来回复？"], label_en: "FILTER", label_cn: "筛选标准", step: "03", step_label: "判断" };
      if (component === "MultiAgentPanel") return { agents: ["Hermes", "Codex", "Claude Code"], label_en: "MULTI AGENT", label_cn: "协作", step: "04", step_label: "协作" };
      if (component === "ProofScreenshotOverlay") return { title: "真实输出证明", asset_path: "", asset_status: "TODO_ASSET_REQUIRED", asset_label: "替换为真实截图", label_en: "PROOF", label_cn: "证据", step: "05", step_label: "证明" };
      if (component === "CTABigEnding") return { keyword: "系统", result: "领取一张流程图，先照着搭起来", label_en: "NEXT STEP", label_cn: "领取资料", step: "DONE", step_label: "领取" };
      return { title: segment.semantic_role === "cta" ? "下一步" : "正确做法", body: caption };
    }

    function slotFor(component, segment) {
      if (segment.layout_slot) return segment.layout_slot;
      if (component === "AgentDashboard") return "wide";
      if (component === "KPIWidget") return "left";
      if (component === "HookScene") return "center";
      if (creatorComponents.has(component)) return "right";
      return "right";
    }

    function renderCreatorSegment(segment, index, component, props) {
      const el = document.createElement("section");
      el.id = `vf-segment-${index}`;
      const variant = props.variant || segment.variant || "";
      const variantClass = variant ? `variant-${variant}` : "";
      el.className = `creator-scene creator-${component.toLowerCase()} density-${segment.density || "medium"} ${variantClass}`.trim();
      el.dataset.component = component;
      el.dataset.group = segment.semantic_group || segment.semantic_role || "";
      el.dataset.variant = variant;
      el.dataset.layoutFamily = props.layout_family || segment.layout_family || segment.layout_slot || "";
      el.dataset.start = String(segment.start);
      el.dataset.duration = String(segment.end - segment.start);

      const labelEn = props.label_en || segment.label_en || "AI CONTENT";
      const labelCn = props.label_cn || segment.label_cn || "内容系统";
      const step = props.step || segment.step || String(index + 1).padStart(2, "0");
      const stepLabel = props.step_label || segment.step_label || "STEP";
      const layout = props.layout_family || props.layout || segment.layout_family || segment.layout_slot || (component === "ThreeStepPipeline" ? "wide" : "right");
      const mainClass = `layout-${layout}`;
      const mainVariantClass = variantClass ? ` ${variantClass}` : "";
      const titleScale = Number(props.title_scale || segment.title_scale || 0.92);
      const themeVars = {
        "--hud-accent": props.accent || "var(--vf-cyan)",
        "--hud-accent-2": props.accent_2 || "var(--vf-green)",
        "--hud-panel-bg": props.panel_bg || "rgba(8, 12, 20, 0.34)",
        "--hud-border": props.border || "rgba(103, 232, 249, 0.20)",
        "--hud-glow": props.glow || "rgba(103, 232, 249, 0.14)"
      };

      let main = "";
      if (component === "BigKineticTitle") {
        const headline = Array.isArray(props.display_lines) && props.display_lines.length > 0
          ? props.display_lines.map((line, lineIndex) => {
              const cleanLine = String(line || "").trim();
              if (lineIndex > 0 && /≠/.test(cleanLine)) {
                const [operator, ...restParts] = cleanLine.split(/\s+/);
                const rest = restParts.join(" ") || cleanLine.replace(/^≠\s*/, "");
                return `<span class="creator-mega-title-line accent"><span class="creator-mega-title-op">${safeText(operator || "≠")}</span><span class="creator-mega-title-text">${safeText(rest || "效率提升")}</span></span>`;
              }
              return `<span class="creator-mega-title-line ${lineIndex > 0 ? "accent" : ""}">${safeText(line)}</span>`;
            }).join("")
          : safeText(props.headline);
        main = `<div class="creator-mega-title" style="--hook-title-scale:${titleScale}">${headline}</div><div class="creator-subline">${richText(props.subline)}</div>`;
      } else if (component === "MegaNumber") {
        main = `<div class="creator-cta-keyword">${richText(props.value)}</div><div class="creator-cta-result">${richText(props.label)}</div>`;
      } else if (component === "OptionSplitCard") {
        main = `<div class="creator-split"><div class="creator-option"><div class="creator-option-title">${safeText(props.left_label || "OLD WAY")}</div><div class="creator-option-body">${richText(props.left)}</div></div><div class="creator-or">${safeText(props.divider || "OR")}</div><div class="creator-option good"><div class="creator-option-title">${safeText(props.right_label || "SYSTEM")}</div><div class="creator-option-body">${richText(props.right)}</div></div></div>`;
      } else if (component === "ThreeStepPipeline") {
        const steps = safeList(props.steps, ["Hermes", "Obsidian", "llm-wiki"]);
        main = `<div class="creator-pipeline">${steps.slice(0, 3).map((stepName, stepIndex) => `<div class="creator-step-card ${stepIndex === 1 ? "active" : ""}"><div class="creator-step-num">0${stepIndex + 1}</div><div class="creator-step-name">${richText(stepName)}</div></div>`).join("")}</div>`;
      } else if (component === "DetailsTableOverlay") {
        const rows = safeList(props.rows, [["痛点", "9.2"], ["复用", "8.8"], ["转化", "8.5"]]);
        const flowSteps = safeList(props.flow_steps, []);
        if (segment.semantic_group === "workflow" && flowSteps.length > 0) {
          const visibleSteps = flowSteps.slice(0, 4);
          main = `<div class="creator-table-title">${richText(props.title)}</div><div class="creator-flow-shell"><div class="creator-flow-grid">${visibleSteps.map((stepItem, stepIndex) => {
            const label = typeof stepItem === "string" ? stepItem : (stepItem.label || stepItem.title || stepItem.name || "");
            const subline = typeof stepItem === "string" ? "" : (stepItem.subline || stepItem.subtitle || stepItem.detail || "");
            const card = `<div class="creator-flow-card"><div class="creator-flow-step">0${stepIndex + 1}</div><div class="creator-flow-label">${richText(label)}</div><div class="creator-flow-subline">${richText(subline)}</div></div>`;
            const arrow = stepIndex < visibleSteps.length - 1 ? `<div class="creator-flow-arrow">→</div>` : "";
            return `${card}${arrow}`;
          }).join("")}</div></div>`;
        } else {
          main = `<div class="creator-table-title">${richText(props.title)}</div><div class="creator-table">${rows.slice(0, 4).map((row) => {
            const score = safeText(row[1]);
            return `<div class="creator-row ${score ? "" : "field-only"}"><span>${richText(row[0])}</span>${score ? `<span class="creator-score">${richText(row[1])}</span>` : ""}</div>`;
          }).join("")}</div>`;
        }
      } else if (component === "ScoringQuestionPanel") {
        const questions = safeList(props.questions, ["能解释痛点？", "能绑定产品？", "能带来回复？"]);
        main = `<div class="creator-table-title">${richText(props.title || "3个筛选问题")}</div><div class="creator-question-list">${questions.slice(0, 3).map((question) => `<div class="creator-question-row"><span class="creator-checkmark">✓</span><span>${richText(question)}</span></div>`).join("")}</div>`;
      } else if (component === "MultiAgentPanel") {
        const agents = safeList(props.agents, [["Hermes", "采集"], ["Obsidian", "沉淀"], ["llm-wiki", "检索"], ["HyperFrames", "包装"], ["Codex", "编排"]]);
        main = `<div class="creator-table-title">${richText(props.title || "多 Agent 协作")}</div><div class="creator-agent-grid">${agents.slice(0, 5).map((agent, agentIndex) => `<div class="creator-agent-card"><div class="creator-agent-role"><span class="creator-mini-badge">A${agentIndex + 1}</span><span>${richText(Array.isArray(agent) ? agent[1] : "AGENT")}</span></div><div class="creator-agent-name">${richText(Array.isArray(agent) ? agent[0] : agent)}</div></div>`).join("")}</div>`;
      } else if (component === "ProofScreenshotOverlay") {
        const assetPath = safeAssetPath(props.asset_path);
        const proofShell = assetPath
          ? `<div class="creator-proof-shell has-asset"><img class="creator-proof-image" src="${assetPath}" alt="${safeText(props.asset_alt || props.title || "真实输出截图")}"><div class="creator-proof-caption"><span>${safeText(props.asset_label || "真实截图")}</span><span>${safeText(props.asset_status || "ASSET_READY")}</span></div></div>`
          : `<div class="creator-proof-shell"><div class="creator-proof-bar"></div><div class="creator-proof-line" style="width:92%"></div><div class="creator-proof-line" style="width:78%"></div><div class="creator-proof-line" style="width:86%"></div><div class="creator-proof-tag">${safeText(props.asset_status || "TODO_ASSET_REQUIRED")}</div></div>`;
        main = `<div class="creator-table-title">${richText(props.title || "真实输出证明")}</div>${proofShell}`;
      } else if (component === "CTABigEnding") {
        const displayLines = Array.isArray(props.display_lines) ? props.display_lines.filter((line) => String(line || "").trim()) : [];
        const keywordText = displayLines[0] || props.keyword;
        const resultText = displayLines[1] || props.result;
        const keywordMarkup = `<span class="creator-cta-keyword-line">${richText(keywordText)}</span>`;
        const buttonTokens = typeof props.button === "string"
          ? props.button.split(/[\/、，,]/g).map((token) => token.trim()).filter(Boolean)
          : [];
        const statusBadge = props.status ? `<div class="creator-mini-badge">${safeText(props.status)}</div>` : "";
        const buttonMarkup = buttonTokens.length > 1
          ? `<div class="creator-cta-tags">${buttonTokens.map((token) => `<span class="creator-cta-tag">${richText(token)}</span>`).join("")}</div>`
          : (props.button ? `<div class="creator-cta-button">${richText(props.button)}</div>` : "");
        main = `${statusBadge}<div class="creator-cta-keyword">${keywordMarkup}</div><div class="creator-cta-result">${richText(resultText)}</div>${buttonMarkup}`;
      } else {
        main = `<div class="creator-table-title">${richText(props.title || props.label || "系统证明")}</div><div class="creator-subline">${richText(props.asset_status || props.result || "TODO_ASSET_REQUIRED")}</div>`;
      }

      Object.entries(themeVars).forEach(([key, value]) => {
        el.style.setProperty(key, value);
      });
      el.dataset.theme = props.theme || segment.semantic_group || segment.semantic_role || component.toLowerCase();
      el.innerHTML = `<div class="creator-top-label"><div><div class="creator-label-en">${safeText(labelEn)}</div><div class="creator-label-cn">${safeText(labelCn)}</div></div></div><div class="creator-step-badge"><div class="creator-step-dot">${safeText(step).slice(0, 2)}</div><div class="creator-step-text">${safeText(stepLabel)}</div></div><div class="creator-main ${mainClass}${mainVariantClass} component-${component}">${main}</div>`;
      document.getElementById("vfStage").appendChild(el);
      return el;
    }

    function renderSegment(segment, index) {
      const component = componentName(segment);
      const props = Object.assign(defaultProps(component, segment), segment.component_props || {});
      if (creatorComponents.has(component)) {
        return renderCreatorSegment(segment, index, component, props);
      }
      const slot = slotFor(component, segment);
      const el = document.createElement("section");
      el.id = `vf-segment-${index}`;
      el.className = `vf-module slot-${slot} vf-${component.toLowerCase()} density-${segment.density || "medium"}`;
      el.dataset.component = component;
      el.dataset.start = String(segment.start);
      el.dataset.duration = String(segment.end - segment.start);

      if (component === "HookScene") {
        el.innerHTML = `<div class="vf-kicker">${safeText(props.kicker || "问题命中")}</div><div class="vf-hook"><h1>${safeText(props.headline)}</h1><p>${safeText(props.subline)}</p></div>`;
      } else if (component === "ProblemAlert") {
        el.innerHTML = `<div class="vf-label">PROBLEM</div><div class="vf-alert-title">${safeText(props.problem)}</div><div class="vf-alert-loss">${safeText(props.loss)}</div>`;
      } else if (component === "KPIWidget") {
        el.innerHTML = `<div class="vf-kpi-value">${safeText(props.value)}</div><div class="vf-kpi-label">${safeText(props.label)}</div><div class="vf-kpi-bar"><span></span></div>`;
      } else if (component === "AgentDashboard") {
        const nodes = Array.isArray(props.nodes) ? props.nodes : ["Hermes", "Obsidian", "llm-wiki", "Codex", "HyperFrames"];
        el.innerHTML = `<div class="vf-agent-title">AI CONTENT SYSTEM</div><div class="vf-agent-nodes">${nodes.slice(0, 6).map((node) => `<div class="vf-agent-node">${safeText(node)}</div>`).join("")}</div>`;
      } else {
        el.innerHTML = `<div class="vf-topic-title">${safeText(props.title)}</div><div class="vf-topic-body">${safeText(props.body)}</div>${segment.proof_point ? `<div class="vf-proof">${safeText(segment.proof_point)}</div>` : ""}`;
      }
      document.getElementById("vfStage").appendChild(el);
      return el;
    }

    function animateSegment(tl, el, segment) {
      const start = Number(segment.start);
      const end = Number(segment.end);
      const inAt = Math.max(0, start + 0.12);
      const outAt = Math.max(inAt + 0.9, end - 0.38);
      const component = el.dataset.component;

      if (creatorComponents.has(component)) {
        const creatorInAt = Math.max(0, start - 0.45);
        const main = el.querySelector(".creator-main");
        const top = el.querySelector(".creator-top-label");
        const badge = el.querySelector(".creator-step-badge");
        const detailItems = el.querySelectorAll(".creator-option, .creator-step-card, .creator-row");

        tl.set(el, { opacity: 1 }, start);
        tl.fromTo(top, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.34, ease: "power2.out" }, creatorInAt);
        tl.fromTo(badge, { opacity: 0, scale: 0.88, y: -12 }, { opacity: 1, scale: 1, y: 0, duration: 0.34, ease: "back.out(1.5)" }, creatorInAt + 0.04);
        tl.fromTo(main, { opacity: 0, y: 32, scale: 0.95, filter: "blur(12px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.48, ease: "power3.out" }, creatorInAt);
        if (detailItems.length) {
          tl.fromTo(detailItems, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.28, stagger: 0.08, ease: "power2.out" }, creatorInAt + 0.22);
        }
        tl.to(main, { boxShadow: "0 0 52px rgba(103, 232, 249, 0.18)", duration: 0.36, yoyo: true, repeat: 1, ease: "power2.inOut" }, creatorInAt + 0.68);
        tl.to([main, top, badge], { opacity: 0, y: -18, duration: 0.28, ease: "power2.in" }, outAt);
        tl.set(el, { opacity: 0 }, end);
        return;
      }

      tl.fromTo(el, { opacity: 0, y: 30, scale: 0.97, filter: "blur(10px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, inAt);
      tl.to(el, { "--scan-x": "130%", duration: 0.85, ease: "power2.out" }, inAt + 0.1);

      if (component === "KPIWidget") {
        tl.fromTo(el.querySelector(".vf-kpi-bar span"), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.out" }, inAt + 0.32);
        tl.to(el, { scale: 1.025, duration: 0.28, yoyo: true, repeat: 1, ease: "power2.inOut" }, inAt + 0.7);
      }

      if (component === "ProblemAlert") {
        tl.to(el, { boxShadow: "0 0 64px rgba(251,191,36,.24)", duration: 0.26, yoyo: true, repeat: 1 }, inAt + 0.28);
      }

      if (component === "AgentDashboard") {
        tl.fromTo(el.querySelectorAll(".vf-agent-node"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.28, stagger: 0.08, ease: "power2.out" }, inAt + 0.22);
      }

      if (component === "HookScene" || segment.animation === "pulse_in") {
        tl.to(el, { scale: 1.018, duration: 0.35, yoyo: true, repeat: 1, ease: "power2.inOut" }, inAt + 0.55);
      }

      tl.to(el, { opacity: 0, y: -18, scale: 0.985, duration: 0.32, ease: "power2.in" }, outAt);
    }

    function animateCaption(tl, text, start, end) {
      const caption = document.getElementById("caption");
      tl.call(() => { caption.textContent = safeText(text); }, null, Math.max(0, start - 0.12));
      tl.to(caption, { opacity: 1, y: 0, duration: 0.16 }, Math.max(0, start - 0.1));
      tl.to(caption, { opacity: 0, duration: 0.16 }, Math.max(start + 0.2, end - 0.12));
    }

    function setupMedia(timeline) {
      const root = document.getElementById("root");
      const frame = document.getElementById("talkingFrame");
      const audio = document.getElementById("narration");
      const video = document.getElementById("talkingVideo");
      const layoutMode = timeline.layout_policy?.mode || (timeline.mode === "talking_head_overlay" ? "talking_head" : "creator_overlay");
      const audioMode = timeline.layout_policy?.audio_mode || (layoutMode === "talking_head" ? "talking_head" : "tts_preview");

      root.dataset.duration = String(timeline.duration);
      root.dataset.layoutMode = layoutMode;
      root.dataset.audioMode = audioMode;
      root.classList.toggle("mode-creator-overlay", layoutMode === "creator_overlay");
      root.classList.toggle("mode-talking", layoutMode === "talking_head");
      root.classList.toggle("mode-audio-tts-preview", audioMode === "tts_preview");
      root.classList.toggle("mode-audio-talking-head", audioMode === "talking_head");
      root.classList.toggle("mode-v07", timeline.visual_pass === "V07_VISUAL_IMPACT_PASS");
      audio.dataset.duration = String(timeline.duration);
      if (video) video.dataset.duration = String(timeline.duration);

      if (layoutMode === "talking_head" && timeline.media.video && video) {
        frame.style.display = "block";
        video.src = timeline.media.video;
        video.load();
        if (timeline.media.audio) {
          audio.src = timeline.media.audio;
        }
        audio.load();
      } else {
        frame.style.display = "none";
        if (timeline.media.audio) audio.src = timeline.media.audio;
        audio.load();
      }
    }

    loadTimeline().then((timeline) => {
      setupMedia(timeline);

      const tl = gsap.timeline({ paused: true });
      const captionTrack = Array.isArray(timeline.captions) && timeline.captions.length > 0
        ? timeline.captions
        : (Array.isArray(timeline.caption_beats) && timeline.caption_beats.length > 0
          ? timeline.caption_beats
          : timeline.segments.map((segment) => ({
              start: segment.start,
              end: segment.end,
              text: segment.text || segment.caption_line,
              caption_line: segment.caption_line || segment.text || ""
            })));

      timeline.segments.forEach((segment, index) => {
        const el = renderSegment(segment, index);
        animateSegment(tl, el, segment);
      });

      captionTrack.forEach((caption) => {
        animateCaption(tl, caption.caption_line || caption.text || "", caption.start, caption.end);
      });

      tl.set({}, {}, timeline.duration);
      window.__timelines = window.__timelines || {};
      window.__timelines.main = tl;
    });
  </script>
</body>
</html>
